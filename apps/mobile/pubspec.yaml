name: mobile
description: SSPILLOWY Mobile Application - DevSecOps Governance
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo_2.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo_2.png
    - assets/sspillowy_logo.png