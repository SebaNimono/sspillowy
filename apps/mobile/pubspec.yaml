name: mobile
description: SSPILLOWY Pulse Mobile App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo/
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo/logo_pestaña.png"
  min_sdk_android: 21
  