workflows:
  ios-release-workflow:
    name: iOS Release Build & Deploy to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: ticasistente
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    scripts:
      - name: Set up keychain to be used for code signing
        script: |
          keychain initialize --path $HOME/Library/Keychains/build.keychain-db
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "com.sspillowy.sspillowy" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates --path $HOME/Library/Keychains/build.keychain-db
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages and iOS configuration
        script: |
          flutter config --no-enable-swift-package-manager
          flutter packages pub get
          flutter build ios --config-only
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build ipa for App Store Distribution
        script: |
          AUTO_BUILD=$(($BUILD_NUMBER + 5))
          flutter build ipa --release \
            --build-number=$AUTO_BUILD \
            --export-options-plist=/Users/builder/export_options.plist
          find . -name "*.ipa" -exec cp {} ./ \; || true
    artifacts:
      - "*.ipa"
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - internal